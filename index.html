<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card Infection</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:black;
}

img{
    width:100vw;
    height:100vh;
    object-fit:cover;
    display:block;
}
.card{
    position:absolute;
    width:64px;
    height:64px;
    border-radius:18px;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:48px;
    opacity:0;
    transform:scale(.2) rotateY(180deg);
    transition:.45s;
}

.mostrar{
    opacity:1;
    transform:scale(1);
}
</style>

</head>

<body>

<img src="screenshot.jpg.PNG" alt="Captura">
    
<script src="script.js"></script>

</body>
</html>
